[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "echomonitor"
version = "0.1.0"
description = "Minimal Streamlit client for the EchoGTFS monitoring API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "altair>=6.2.2,<7",
    "pandas>=3.0.5,<4",
    "streamlit>=1.62,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
